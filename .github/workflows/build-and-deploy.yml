# ISSUE: Workflow omitted pre-build feed fetching and PATH_PREFIX env var, breaking GitHub Pages asset links.
# CORRECTION: Add pre-build scout ingestion, shortlink generation, and explicit PATH_PREFIX env var.
name: Build and Deploy Static Feed

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0,12 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Secret Scanning & Redaction Audit
        run: node scripts/redact-secrets.mjs registry/news-platforms.json

      - name: Run Tests
        run: npm test

      - name: Fetch Feeds & Pre-Populate Registries
        run: node scripts/fetch-feeds.mjs

      - name: Build Eleventy Static Site
        env:
          PATH_PREFIX: "/news-zero/"
        run: npm run build

      - name: Generate Static Shortlinks
        run: node scripts/generate-short-links.mjs

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
